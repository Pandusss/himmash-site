name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          # Preview on GitHub Pages: SITE_URL=https://<user>.github.io, BASE_PATH=/<repo>/
          # Own domain: SITE_URL=https://xn--24-6kc5aua4d2a.xn--p1ai, BASE_PATH=/
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          # The preview has no PHP: its form posts to the handler on the hosting, e.g.
          # https://himmash24.com/api/send-form.php (add the preview's origin to FORM_ORIGINS).
          PUBLIC_FORM_ENDPOINT: ${{ vars.PREVIEW_FORM_ENDPOINT }}
          PUBLIC_FORM_ACCESS_KEY: ${{ vars.PUBLIC_FORM_ACCESS_KEY }}
          # "true" on preview deployments: noindex on every page and Disallow in robots.txt.
          PUBLIC_NOINDEX: ${{ vars.PUBLIC_NOINDEX }}
          # Counters stay off on the preview unless these are set (see src/data/analytics.ts).
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
